[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

  # The Hacktoberfest year the site collects submissions for.
  #
  # NEXT_PUBLIC_* vars are inlined into the bundle at build time, so rolling
  # the year needs a rebuild -- redeploying an existing build will not pick
  # it up. Keeping it here rather than in the Netlify UI means changing it is
  # a commit, and a commit always rebuilds.
  NEXT_PUBLIC_HACKTOBERFEST_YEAR = "2026"

  # Manual kill switch to pause sign ups while site changes are in progress,
  # independent of the year cutoff above. Same build-time-inlining caveat as
  # NEXT_PUBLIC_HACKTOBERFEST_YEAR -- flipping this needs a rebuild.
  #
  # Set to "false" (or remove the line) and redeploy to reopen sign ups.
  NEXT_PUBLIC_SIGNUPS_PAUSED = "true"

[dev]
  # netlify dev proxies to Next and starts the local Postgres alongside it.
  # It must call dev:next rather than dev, or it would invoke itself.
  command = "pnpm dev:next"
  targetPort = 3000
  port = 8888
  framework = "#custom"

# Auth on deploy previews and branch deploys
#
# The site is served on more than one hostname, so there is no single correct
# base URL to pin. lib/auth.ts derives it from the request and validates the
# result against an allowlist:
#
#   baseURL: {
#     allowedHosts: ['hacktoberfest.virtualcoffee.io', '*.netlify.app'],
#     protocol: 'https',
#     fallback: 'https://hacktoberfest.virtualcoffee.io',
#   }
#
# allowedHosts also seeds trustedOrigins, so there is no second list to keep in
# sync. This replaces both NEXTAUTH_URL and AUTH_TRUST_HOST. The real hostname
# reaches functions as x-forwarded-host, which Better Auth ignores unless
# advanced.trustedProxyHeaders is set -- it is; a forged host still has to
# match allowedHosts.
#
# Do NOT set BETTER_AUTH_URL in the Netlify UI for any context. It is a
# local-development override only.
#
# A GitHub OAuth app accepts exactly one callback URL, so a preview hostname
# cannot finish the OAuth round-trip on its own. lib/auth.ts loads Better Auth's
# oAuthProxy plugin on Netlify: previews send GitHub to production's callback,
# production exchanges the code and hands the encrypted profile back to the
# preview origin. Production skips the hop automatically. Only the production
# callback URL is registered on the GitHub OAuth app.
#
# BETTER_AUTH_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET and
# OAUTH_PROXY_SECRET must be set in the Netlify UI with the "Functions" scope
# so they reach the function runtime. OAUTH_PROXY_SECRET must hold the SAME
# value in every deploy context -- production encrypts what the preview
# decrypts, and a mismatch surfaces as a state_mismatch error on sign-in.
# Variables declared in this file are build-time only.
