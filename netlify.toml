[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

  # The Hacktoberfest year the site collects submissions for.
  #
  # NEXT_PUBLIC_* vars are inlined into the bundle at build time, so rolling
  # the year needs a rebuild -- redeploying an existing build will not pick
  # it up. Keeping it here rather than in the Netlify UI means changing it is
  # a commit, and a commit always rebuilds.
  NEXT_PUBLIC_HACKTOBERFEST_YEAR = "2026"

  # Manual kill switch to pause sign ups while site changes are in progress,
  # independent of the year cutoff above. Same build-time-inlining caveat as
  # NEXT_PUBLIC_HACKTOBERFEST_YEAR -- flipping this needs a rebuild.
  #
  # Set to "false" (or remove the line) and redeploy to reopen sign ups.
  NEXT_PUBLIC_SIGNUPS_PAUSED = "true"

[dev]
  # netlify dev proxies to Next and starts the local Postgres alongside it.
  # It must call dev:next rather than dev, or it would invoke itself.
  command = "pnpm dev:next"
  targetPort = 3000
  port = 8888
  framework = "#custom"

# Auth secrets are set in the Netlify UI, not here -- variables declared in this
# file are build-time only. Which values go in which context: README
# "Authentication".
