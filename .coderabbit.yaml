# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  suggested_labels: false
  suggested_reviewers: false
  estimate_code_review_effort: false
  auto_review:
    enabled: true
    drafts: false
    # Any target branch, not just main — stacked PRs target their parent layer.
    base_branches:
      - '.*'
    # Opt in per PR: only PRs carrying this label are reviewed automatically.
    labels:
      - 'coderabbit-review'
  # Generated or frozen files — never review-worthy. Snapshots are drizzle-kit
  # bookkeeping rewritten on every `pnpm db:generate` (see drizzle.config.ts);
  # auth.ts is Better Auth CLI output and must not be hand-edited (README).
  path_filters:
    - '!pnpm-lock.yaml'
    - '!db/.drizzle/**/snapshot.json'
    - '!db/schema/auth.ts'
  pre_merge_checks:
    docstrings:
      mode: off # comments are one-line pointers, not doc prose
  finishing_touches:
    docstrings:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'README.md'
      - '**/CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/adr/**/*.md'
